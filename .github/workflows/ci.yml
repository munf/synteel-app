# Tests, type check, build and the offline evaluation on pushes to main and on pull requests.
# No secrets: every AI step runs against example drafts or a pretend API (SYNTEEL_AI_MOCK=1, bench --mock).
# Kept small for a private repo's Actions minutes: one job, superseded runs cancelled, docs-only changes skipped,
# and pushes run on main only (a branch with a pull request is checked once, by the pull_request run).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYNTEEL_AI_MOCK: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # package.json engines: node >=24 (TypeScript runs directly, node:sqlite built in).
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Type check (app)
        run: npx tsc --noEmit -p web
      - name: Build (app and team dashboard)
        run: npm run build
      - name: Offline evaluation
        run: npm run eval
      - name: Benchmark pipeline against a pretend API
        run: npm run eval -- bench --mock
